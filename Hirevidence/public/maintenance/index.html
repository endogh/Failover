<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hirevidence.com — Sedang "Wawancara" Server Cadangan</title>

<style>
  /* ===== Reset dasar ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-dark: #0b0f1a;
    --bg-darker: #060811;
    --accent: #6c5ce7;
    --accent-2: #00d4ff;
    --text-light: #f5f6fa;
    --text-dim: #9aa4b2;
  }

  html, body {
    height: 100%;
    background: radial-gradient(circle at 20% 20%, #131a2b 0%, var(--bg-dark) 45%, var(--bg-darker) 100%);
    color: var(--text-light);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  /* ===== Container utama, di-center vertikal & horizontal ===== */
  .wrapper {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ===== Partikel bintang di background (dekorasi) ===== */
  .stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(1); }
    50% { opacity: 0.9; transform: scale(1.4); }
  }

  /* ===== Kartu konten ===== */
  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 48px 40px;
    max-width: 520px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  /* ===== Ikon gear berputar (animasi utama) ===== */
  .gear-box {
    position: relative;
    width: 110px;
    height: 110px;
    margin: 0 auto 28px auto;
    animation: floatY 4s ease-in-out infinite;
  }
  .gear {
    width: 100%;
    height: 100%;
    animation: spin 6s linear infinite;
    filter: drop-shadow(0 0 12px rgba(108,92,231,0.6));
  }
  .gear.small {
    width: 46px;
    height: 46px;
    position: absolute;
    top: -8px;
    right: -14px;
    animation: spin-reverse 4s linear infinite;
    filter: drop-shadow(0 0 8px rgba(0,212,255,0.6));
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes spin-reverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }

  h1 {
    font-size: 26px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 22px;
  }

  .domain {
    color: var(--text-light);
    font-weight: 600;
  }

  /* ===== Progress bar animasi indeterminate ===== */
  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    width: 40%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    50% { transform: translateX(80%); }
    100% { transform: translateX(250%); }
  }

  /* ===== Dot titik-titik "sedang bekerja" ===== */
  .dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 3px;
    background: var(--accent-2);
    border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* ===== Lencana "wawancara sedang berlangsung" ===== */
  .interview-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(255,71,87,0.10);
    border: 1px solid rgba(255,71,87,0.4);
    color: #ff4757;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4px;
    margin-bottom: 18px;
  }
  .rec-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff4757;
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,71,87,0.5); }
    50%      { opacity: 0.35; box-shadow: 0 0 0 6px rgba(255,71,87,0); }
  }

  /* ===== Animasi masuk halus + delay berurutan ===== */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }
  .interview-badge,
  h1, p, .progress-track, .dots, .footer-note {
    animation: fadeInUp 0.7s ease both;
  }
  h1              { animation-delay: 0.12s; }
  p               { animation-delay: 0.24s; }
  .progress-track { animation-delay: 0.36s; }
  .dots           { animation-delay: 0.48s; }
  .footer-note    { animation-delay: 0.6s; }

  .footer-note {
    margin-top: 26px;
    font-size: 12px;
    color: #5a6270;
  }

  @media (max-width: 480px) {
    .card { padding: 34px 22px; margin: 16px; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>

  <div class="wrapper">
    <div class="stars" id="stars"></div>

    <div class="card">
      <div class="gear-box">
        <svg class="gear" viewBox="0 0 24 24" fill="none">
          <path fill="url(#grad1)" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.94-3.5c0-.61-.06-1.21-.15-1.79l1.87-1.46a.5.5 0 0 0 .12-.64l-1.77-3.06a.5.5 0 0 0-.6-.22l-2.2.88a7.6 7.6 0 0 0-1.55-.9L15.3.9a.5.5 0 0 0-.5-.4h-3.6a.5.5 0 0 0-.5.4l-.36 2.36a7.6 7.6 0 0 0-1.55.9l-2.2-.88a.5.5 0 0 0-.6.22L4.22 6.5a.5.5 0 0 0 .12.64l1.87 1.46c-.1.58-.15 1.18-.15 1.79s.06 1.21.15 1.79L4.34 13.6a.5.5 0 0 0-.12.64l1.77 3.06c.13.22.4.31.6.22l2.2-.88c.47.37.99.67 1.55.9l.36 2.36c.05.24.26.4.5.4h3.6c.24 0 .45-.16.5-.4l.36-2.36c.56-.23 1.08-.53 1.55-.9l2.2.88c.2.09.47 0 .6-.22l1.77-3.06a.5.5 0 0 0-.12-.64l-1.87-1.46c.09-.58.15-1.18.15-1.79Z"/>
          <defs>
            <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#6c5ce7"/>
              <stop offset="100%" stop-color="#00d4ff"/>
            </linearGradient>
          </defs>
        </svg>
        <svg class="gear small" viewBox="0 0 24 24" fill="none">
          <path fill="#00d4ff" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.94-3.5c0-.61-.06-1.21-.15-1.79l1.87-1.46a.5.5 0 0 0 .12-.64l-1.77-3.06a.5.5 0 0 0-.6-.22l-2.2.88a7.6 7.6 0 0 0-1.55-.9L15.3.9a.5.5 0 0 0-.5-.4h-3.6a.5.5 0 0 0-.5.4l-.36 2.36a7.6 7.6 0 0 0-1.55.9l-2.2-.88a.5.5 0 0 0-.6.22L4.22 6.5a.5.5 0 0 0 .12.64l1.87 1.46c-.1.58-.15 1.18-.15 1.79s.06 1.21.15 1.79L4.34 13.6a.5.5 0 0 0-.12.64l1.77 3.06c.13.22.4.31.6.22l2.2-.88c.47.37.99.67 1.55.9l.36 2.36c.05.24.26.4.5.4h3.6c.24 0 .45-.16.5-.4l.36-2.36c.56-.23 1.08-.53 1.55-.9l2.2.88c.2.09.47 0 .6-.22l1.77-3.06a.5.5 0 0 0-.12-.64l-1.87-1.46c.09-.58.15-1.18.15-1.79Z"/>
        </svg>
      </div>

      <div class="interview-badge">
        <span class="rec-dot"></span>
        Wawancara Sedang Berlangsung
      </div>

      <h1>Sistem kami sedang <span class="domain">"Wawancara Kerja"</span> dengan server cadangan.</h1>
      <p>
        Kami sedang memastikan infrastruktur kami tetap memenuhi kualifikasi
        standar tertinggi perusahaan Anda. Proses ini hanya memakan waktu singkat.
      </p>

      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>

      <div class="dots">
        <span></span><span></span><span></span>
      </div>

      <div class="footer-note">© <span id="year"></span> hirevidence.com — segera kembali</div>
    </div>
  </div>

  <script>
    function generateStars(count) {
      const container = document.getElementById('stars');
      if (!container) return;

      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.top = `${Math.random() * 100}%`;
        star.style.left = `${Math.random() * 100}%`;
        star.style.animationDuration = `${2 + Math.random() * 3}s`;
        star.style.animationDelay = `${Math.random() * 3}s`;
        container.appendChild(star);
      }
    }

    function setFooterYear() {
      const yearEl = document.getElementById('year');
      if (yearEl) yearEl.textContent = new Date().getFullYear();
    }

    document.addEventListener('DOMContentLoaded', () => {
      generateStars(60);
      setFooterYear();
    });
  </script>

</body>
</html>
