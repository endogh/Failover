<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>codenest.id — Sedang Maintenance</title>
<meta name="robots" content="noindex"> <!-- jangan sampai halaman maintenance ke-index Google -->
<style>
  /* ===== Design tokens ===== */
  /* Tema: "nest" di malam hari — gelap tenang dengan satu titik cahaya amber,
     dipadukan gaya terminal karena ini situs developer. */
  :root {
    --bg: #12181f;         /* ink navy, bukan hitam pekat */
    --bg-card: #1a222c;
    --text: #eef1f5;
    --text-muted: #8b96a6;
    --accent: #f2a154;     /* amber hangat, kesan "cahaya di sarang" */
    --border: #2a3441;
    --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    padding: 24px;
  }

  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  /* Titik status berdenyut pelan — signature element halaman ini */
  .status-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    margin: 0 auto 28px;
    box-shadow: 0 0 0 0 rgba(242, 161, 84, 0.6);
    animation: pulse 2.4s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(242, 161, 84, 0.5); }
    70%  { box-shadow: 0 0 0 16px rgba(242, 161, 84, 0); }
    100% { box-shadow: 0 0 0 0 rgba(242, 161, 84, 0); }
  }

  h1 {
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  p.lede {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 32px;
  }

  /* Blok gaya terminal — nyambung sama identitas "codenest" sebagai dev */
  .terminal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 22px;
    text-align: left;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.9;
    color: var(--text-muted);
  }

  .terminal .prompt { color: var(--accent); }
  .terminal .ok { color: #7ee0a8; }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  footer {
    margin-top: 28px;
    font-size: 13px;
    color: var(--text-muted);
  }

  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* Hormati preferensi user yang sensitif terhadap animasi */
  @media (prefers-reduced-motion: reduce) {
    .status-dot, .cursor { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="status-dot" aria-hidden="true"></div>

    <h1>codenest.id sedang dibenahi</h1>
    <p class="lede">
      Server utama lagi maintenance. Bukan hilang, cuma lagi diCuci dan dijemur.
      Coba lagi sebentar lagi ya.
    </p>

    <div class="terminal" role="status" aria-live="polite">
      <div><span class="prompt">$</span> curl -I codenest.id</div>
      <div><span class="ok">✓</span> status: maintenance mode</div>
      <div>eta: segera<span class="cursor" aria-hidden="true"></span></div>
    </div>

    <footer>
      Update progres ada di <a href="https://twitter.com" target="_blank" rel="noopener">Twitter/X</a>
      — atau langsung email <a href="mailto:hello@codenest.id">hello@codenest.id</a>
    </footer>
  </main>
</body>
</html>
